<!DOCTYPE html>
<html lang="pt-br" data-en-doctitle="Virtual participation — MOJ" data-es-doctitle="Participación virtual — MOJ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Participação virtual — MOJ</title>
  <script>try{if(localStorage.getItem('moj_theme')==='dark'){document.write('<link rel="stylesheet" id="moj-theme-dark" href="/shared/styles/theme-dark.css">');document.documentElement.setAttribute('data-theme','dark')}}catch(e){}</script>
  <link rel="stylesheet" href="/shared/ui.css">
  <link rel="icon" type="image/svg+xml" href="/shared/assets/logo_moj.svg">
  <link rel="stylesheet" href="/shared/styles/pages/treino-virtual.css">
</head>
<body>
  <header class="topbar">
    <div class="bar">
      <a class="brand" href="/"><img src="/shared/assets/logo_moj.svg" alt="MOJ"> MOJ
        <span class="slogan">Melhor Online Judge</span> <span class="badge-beta">BETA</span></a>
      <div class="spacer"></div>
      <nav class="navlinks">
        <a href="/" data-en="Home" data-es="Inicio">Página Inicial</a>
        <a href="/treino/" data-en="Free Training" data-es="Entrenamiento libre">Treino Livre</a>
        <a href="/contests/" data-en="Contests" data-es="Competencias">Contests</a>
        <span id="authArea" class="row"></span>
      </nav>
    </div>
  </header>
  <main class="container">
    <div id="vhead" class="section"><span class="muted" data-en="loading…" data-es="cargando…">carregando…</span></div>
    <div id="vstart" class="section hidden"></div>
    <div id="varena" class="hidden">
      <div class="section"><h2 data-en="Problems" data-es="Problemas">Problemas</h2><div id="vprobs"></div></div>
      <div class="section"><h2 data-en="My submissions" data-es="Mis envíos">Minhas submissões</h2><div id="vsubs"></div></div>
    </div>
    <div id="vboardsec" class="section hidden">
      <h2 id="vboardtitle" data-en="Scoreboard" data-es="Marcador">Placar</h2>
      <!-- a MESMA barra do placar oficial (coorte, bandeira, universidade, sede, busca) + "Virtuais" -->
      <div class="fbar hidden" id="vfilters"></div>
      <!-- "meus escolhidos": virtuais que aparecem sempre (lista da conta; /treino/virtual/friends) -->
      <div class="section hidden" id="vfriends" style="margin:.4rem 0 .8rem"></div>
      <div id="vreplay" class="vr-replay hidden"></div>
      <div id="vboard"></div>
    </div>
  </main>
  <script type="module" src="/shared/i18n-dom.js"></script>
  <script type="module" src="/shared/site-header.js"></script>
  <script type="module" src="/shared/site-footer.js"></script>
  <script type="module" src="./virtual.js"></script>
</body>
</html>
